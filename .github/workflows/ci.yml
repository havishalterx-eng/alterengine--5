name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Warn until the end of Phase 1, then flip to fail.
  # See docs/build/DECISIONS.md — warn first reveals the true violation count
  # before it blocks anyone.
  GATE_MODE: warn

  # Tests that touch a real dependency need these. Their absence is why CI
  # was failing while every local run passed -- a local .env supplied them
  # and CI had nothing, so the branch was verified under conditions the real
  # system does not have.
  ALTER_RUNTIME_MODE: test
  DATABASE_URL: postgresql://alter:alter_local_dev@localhost:5440/alter
  REDIS_URL: redis://localhost:6390
  TEMPORAL_ADDRESS: localhost:7240
  REDIS_KEY_PREFIX: alter:ci

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: alter
          POSTGRES_PASSWORD: alter_local_dev
          POSTGRES_DB: alter
        ports:
          - 5440:5432
        options: >-
          --health-cmd "pg_isready -U alter -d alter"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      redis:
        image: redis:7-alpine
        ports:
          - 6390:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Tests
        run: pnpm test

      - name: Capability inventory is current
        # A registry change that was not regenerated cannot reach main, so the
        # inventory and the code cannot drift apart silently.
        run: pnpm inventory:check

      - name: Architecture gates
        run: pnpm gates

      - name: Entry points actually run
        # A component that compiles and has never executed is not built. This
        # is the smallest possible version of that rule, applied to CI itself.
        #
        # The worker is long-running: it schedules the audit verifier and the
        # retention sweeper, so it must NOT exit. The first version of this step
        # ran each entry point and waited for it to finish, which hung the whole
        # job for 20 minutes once component 38 landed. "Started and stayed up"
        # is success for a worker; exiting would be the failure.
        run: |
          set -euo pipefail

          run_short_lived() {
            echo "checking $1 exits cleanly"
            node "$1"
          }

          run_long_lived() {
            echo "checking $1 starts and stays up"
            set +e
            timeout 10s node "$1"
            code=$?
            set -e
            # 124 is timeout's exit code: still running when the clock ran out,
            # which is exactly what a healthy worker should do.
            if [ "$code" -ne 124 ]; then
              echo "$1 exited with $code instead of staying up"
              exit 1
            fi
          }

          run_short_lived apps/api/dist/index.js
          run_short_lived apps/sandbox/dist/index.js
          run_long_lived apps/worker/dist/index.js
